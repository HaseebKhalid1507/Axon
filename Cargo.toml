[package]
name = "axon"
version = "0.1.0"
edition = "2024"
# let-chains and <[T]>::as_chunks need 1.88; the avxvnni target feature, 1.89.
rust-version = "1.89"
authors = ["Haseeb Khalid <haseebkhalid1507@gmail.com>"]
description = "The arc reactor for inference"
repository = "https://github.com/HaseebKhalid1507/Axon"
license = "MIT"
readme = "README.md"
keywords = ["inference", "llm", "machine-learning", "quantization"]
categories = ["science", "mathematics"]

[dependencies]
memmap2 = "0.9"
ratatui = "0.29"
crossterm = "0.28"
fancy-regex = "0.16"

[dev-dependencies]
serde_json = "1"

# The model tests run real forward passes; unoptimized they take minutes.
[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# `cargo build --profile profiling`: release codegen with symbols, for perf.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
