# No global target-cpu: the default build runs on any x86-64 CPU. The hot code
# picks its x86-64-v3 / AVX-VNNI variant at runtime (quant.rs kernels, mv.rs
# multiversioned loops), so a native build gives the same bits and about the
# same speed. To opt in anyway:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
