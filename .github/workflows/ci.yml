name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Safe to set: .cargo/config.toml has no rustflags (no target-cpu), so CI
  # builds the same baseline x86-64 binary as a dev machine.
  RUSTFLAGS: "-D warnings"
  # The 491 MB test model isn't in the repo. Tests that need it skip; the rest still run.
  AXON_SKIP_MODEL_TESTS: "1"
  # No GPU either: the CUDA tests skip (visibly); the rest still run.
  AXON_SKIP_GPU_TESTS: "1"

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04 around 10-28 and the Nehalem qemu step
    # then dies with an illegal instruction 0.04 s into the test binary (#173's runs
    # 40920095496 / 40920119299 / 40920649257; main was green on 24.04 on 10-27).
    # Bump deliberately, with a CI run that shows the qemu step still passes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain on the dev machine, so new lints in a fresh
      # stable release can't turn CI red on code that's clean locally.
      # Bump this when the dev machine updates.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The repo is public: a committed agent trace must be synthetic and numbers-only (scripts/agent_trace.py).
      - name: committed agent traces are synthetic and numbers-only
        run: python3 scripts/agent_trace.py --check-committed
      # The agent replay harness's offline self-test (stdlib only, no engine or model, ~0.1 s).
      - name: agent replay self-test
        run: python3 scripts/agent_replay_selftest.py
      # golden.py's parsers and verdict logic on canned `axon logits` output (stdlib only, no model, ~0.1 s).
      - name: golden self-test
        run: python3 scripts/golden_selftest.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      # The lib's unit tests and doc tests; also builds the binary and examples/embed.rs.
      - run: cargo test
      # rustdoc passes a compile_fail block on any error; this checks each
      # fails with the error code it names (scripts/compile_fail_check.py).
      - name: compile_fail doc tests fail for their stated reason
        run: |
          cargo build --lib
          python3 scripts/compile_fail_check.py target/debug/libaxon.rlib target/debug/deps
      # The SIMD tests skip paths the runner's CPU lacks (GitHub runners usually
      # have AVX2 but not AVX-VNNI). Rerun them uncaptured so each skip shows
      # up as a ::warning:: annotation instead of passing silently.
      - name: SIMD / multiversion tests (skips visible)
        run: cargo test -- --nocapture simd lanes multiversion
      # The portable variants and scalar kernels, through the normal dispatch.
      - name: Tests on the scalar path
        run: cargo test
        env:
          AXON_SIMD: scalar
      - run: cargo build --release
      # The default build must run on a pre-AVX CPU: no global target-cpu, AVX
      # only behind runtime detection. Run the unit tests under a Nehalem CPU
      # model, so the scalar kernels and portable variants actually execute
      # there (the avx2/vnni/v3 tests skip themselves); any stray AVX
      # instruction is a SIGILL. No model in CI, so model tests skip.
      - name: Tests and release binary on a Nehalem CPU (qemu-user)
        env:
          AXON_SKIP_MODEL_TESTS: "1"
          AXON_SKIP_GPU_TESTS: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          cargo test --release --no-run 2>&1 | tee no-run.log
          # The library's test harness (every unit test is in the lib; the binary has none).
          bin=$(grep -oE 'unittests src/lib.rs \(target/release/deps/axon-[0-9a-f]+' no-run.log | grep -oE 'target/.*')
          test -x "$bin"
          # attend_matches_per_head sweeps ~300 context lengths x 16 shapes: 40 s on
          # the scalar path natively (the "scalar path" step above runs it), ~18 min
          # under qemu. The other attention tests still run the same code here.
          qemu-x86_64 -cpu Nehalem "$bin" --skip model::tests::attend_matches_per_head
          qemu-x86_64 -cpu Nehalem target/release/axon --help
          qemu-x86_64 -cpu Nehalem target/release/axon --version

  # Process v2 rule 8: real small-model tests against independent references, on every PR. Next to `check`, so
  # the per-PR wall time stays that job's (~12 min). The test model (CONTRIBUTING.md) is cached across runs and its
  # sha256 checked before use; the other test models stay absent, and AXON_SKIP_MODEL_TESTS skips their tests.
  # The heavy parts (the whole suite with the model, the fuzzers) run nightly: .github/workflows/nightly.yml.
  model-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: test model (cached)
        id: model
        uses: actions/cache@v4
        with:
          path: models/qwen2.5-0.5b-q4_k_m.gguf
          key: model-qwen2.5-0.5b-q4_k_m-74a4da8c
      - name: download the test model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL --retry 5 -o models/qwen2.5-0.5b-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
      - name: the test model is the one the fixtures were made from
        run: echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  models/qwen2.5-0.5b-q4_k_m.gguf" | sha256sum -c
      # tokenizer::tests::oracle      token ids = Hugging Face's tokenizer (tests/fixtures/tokens.json)
      # model::tests::matches_ollama  ollama's recorded greedy path, logprob by logprob (tests/fixtures/gen/)
      # golden                        dequantized rows = gguf-py's dequantizer (tests/fixtures/golden/)
      # A test whose model is missing returns early and libtest says `ok`: the log must show both model tests
      # passing and no skip of the test model.
      - name: model tests against independent oracles
        run: |
          set -o pipefail
          cargo test --lib -- --nocapture tokenizer::tests::oracle model::tests::matches_ollama golden 2>&1 | tee oracles.log
          if grep -n "skipping: models/qwen2.5-0.5b-q4_k_m.gguf" oracles.log; then exit 1; fi
          grep -q "^test tokenizer::tests::oracle ... ok$" oracles.log
          grep -q "^test model::tests::matches_ollama ... ok$" oracles.log
          grep -q "^test quant::tests::golden_rows ... ok$" oracles.log
